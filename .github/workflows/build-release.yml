name: Build Foundry module

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out module
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate, test, and stage
        run: npm run build

      - name: Verify tag and manifest versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p "require('./module.json').version")"

      - name: Package Foundry module
        shell: bash
        run: |
          cd release/cwn-combat-enhancements
          zip -r ../cwn-combat-enhancements-${GITHUB_REF_NAME}.zip .
          cp module.json ../module.json
          test -s ../cwn-combat-enhancements-${GITHUB_REF_NAME}.zip
          test -s ../module.json
          unzip -t ../cwn-combat-enhancements-${GITHUB_REF_NAME}.zip
          unzip -Z1 ../cwn-combat-enhancements-${GITHUB_REF_NAME}.zip | grep -qx "module.json"
          unzip -Z1 ../cwn-combat-enhancements-${GITHUB_REF_NAME}.zip | grep -qx "scripts/chat-card.mjs"
          unzip -Z1 ../cwn-combat-enhancements-${GITHUB_REF_NAME}.zip | grep -qx "scripts/network-console/network-model.mjs"
          unzip -Z1 ../cwn-combat-enhancements-${GITHUB_REF_NAME}.zip | grep -qx "scripts/network-console/demon-rules.mjs"
          unzip -Z1 ../cwn-combat-enhancements-${GITHUB_REF_NAME}.zip | grep -qx "scripts/network-console/network-console.mjs"
          unzip -Z1 ../cwn-combat-enhancements-${GITHUB_REF_NAME}.zip | grep -qx "styles/network-console.css"
          unzip -Z1 ../cwn-combat-enhancements-${GITHUB_REF_NAME}.zip | grep -qx "styles/cwn-combat-enhancements.css"
          unzip -Z1 ../cwn-combat-enhancements-${GITHUB_REF_NAME}.zip | grep -qx "templates/network-console/console.hbs"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cwn-combat-enhancements-${{ github.ref_name }}
          path: |
            release/cwn-combat-enhancements-${{ github.ref_name }}.zip
            release/module.json

      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/cwn-combat-enhancements-${{ github.ref_name }}.zip
            release/module.json
